name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Actions → CI → "Run workflow"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIN_COVERAGE: "80"

jobs:
  check:
    name: Unit tests + coverage + assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # v3 defaults to obsolete `tools` (removed by Google). Prefer v4.0.2+ defaults or explicit platform-tools.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, coverage gate, assembleDebug
        id: unit
        continue-on-error: true
        run: ./gradlew check assembleDebug --stacktrace

      - name: Upload unit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: |
            **/build/reports/jacoco/**
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore

      - name: Fail if unit checks failed
        if: steps.unit.outcome != 'success'
        run: exit 1

  ui-tests:
    name: Compose UI tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          sudo chmod 666 /dev/kvm || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests
        id: ui
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload UI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-reports
          path: |
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
            **/build/reports/connected/**
          if-no-files-found: ignore

      - name: Fail if UI tests failed
        if: steps.ui.outcome != 'success'
        run: exit 1

  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [check, ui-tests]
    if: always()
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MIN_COVERAGE: "80"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download unit reports
        uses: actions/download-artifact@v4
        with:
          name: unit-reports
          path: ci-artifacts/unit
        continue-on-error: true

      - name: Download UI reports
        uses: actions/download-artifact@v4
        with:
          name: ui-reports
          path: ci-artifacts/ui
        continue-on-error: true

      - name: Notify Telegram (tests)
        run: |
          python3 scripts/ci/telegram_notify.py tests \
            --outcome "${{ needs.check.result }}" \
            --ui-outcome "${{ needs.ui-tests.result }}" \
            --artifacts-dir ci-artifacts
